name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Install Android SDK
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip
          mv cmdline-tools $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Fix spec for Android
        run: |
          sed -i "s/^requirements.*/requirements = python3,kivy/" buildozer.spec
          sed -i "s/^android.arch.*/android.arch = arm64-v8a/" buildozer.spec
          sed -i "s/^android.api.*/android.api = 31/" buildozer.spec
          sed -i "s/^android.minapi.*/android.minapi = 21/" buildozer.spec
          sed -i "s/^android.ndk.*/android.ndk = 25b/" buildozer.spec
          sed -i "s/^android.sdk.*/android.sdk = 31/" buildozer.spec
          grep -E "requirements|android.arch|android.api|android.minapi|android.ndk" buildozer.spec
      - name: Build
        run: |
          buildozer -v android debug
        env:
          ACCEPT_ANDROID_SDK_LICENSES: "1"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KKE-APK
          path: bin/*.apk
